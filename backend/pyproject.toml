[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.0",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.51.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "email-validator>=2.1.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "geoalchemy2>=0.15.0",
    # Object Storage (S3-compatible / RustFS)
    "aioboto3>=13.0.0",
    # Email
    "aiosmtplib>=3.0.0",
    "jinja2>=3.1.0",
    # Config
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
]

# ── pytest configuration ─────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests requiring a real PostGIS database (docker)",
]
filterwarnings = [
    "ignore::DeprecationWarning:passlib.*",
]
