services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: earthiq
      POSTGRES_USER: earthiq
      POSTGRES_PASSWORD: earthiq
    volumes:
    - postgres_data:/var/lib/postgresql/data
    ports:
    - 5432:5432
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U earthiq -d earthiq
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
    - 6379:6379
  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      target: development
    ports:
    - 8000:8000
    depends_on:
      db:
        condition: service_healthy
    volumes:
    - ./backend:/app/backend
    - ./modules:/app/modules
    environment:
    - PYTHONUNBUFFERED=1
    - DATABASE_URL=postgresql+asyncpg://earthiq:earthiq@db:5432/earthiq
    - JWT_SECRET=${JWT_SECRET:-change-me-in-dev}
    - CORS_ORIGINS=["http://localhost:3000"]
    - DEBUG=false
  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
      target: development
    ports:
    - 3000:3000
    depends_on:
    - backend
    volumes:
    - ./frontend:/app/frontend
    - /app/frontend/node_modules
    - /app/frontend/apps/web/node_modules
    - ./modules:/app/modules
    environment:
    - VITE_API_URL=http://localhost:8000
volumes:
  postgres_data: null
