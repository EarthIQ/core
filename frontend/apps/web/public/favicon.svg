<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="EarthIQ">
  <defs>
    <radialGradient id="eiq-bg" cx="50%" cy="36%" r="78%">
      <stop offset="0%" stop-color="#13253D"/>
      <stop offset="100%" stop-color="#070D18"/>
    </radialGradient>
    <linearGradient id="eiq-globe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A3A5E"/>
      <stop offset="100%" stop-color="#0B1A2E"/>
    </linearGradient>
    <filter id="eiq-glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- App-icon background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#eiq-bg)" stroke="#1E3350" stroke-width="1"/>
  <circle cx="32" cy="32" r="25" fill="none" stroke="#0891B2" stroke-width="1.4" stroke-dasharray="3 4.5" opacity="0.45"/>

  <!-- Globe -->
  <circle cx="32" cy="32" r="18" fill="url(#eiq-globe)" stroke="#3E6394" stroke-width="2"/>
  <g fill="none" stroke="#6E95CB" opacity="0.55">
    <ellipse cx="32" cy="32" rx="18" ry="7" stroke-width="1.3"/>
    <ellipse cx="32" cy="32" rx="8" ry="18" stroke-width="1.3"/>
  </g>

  <!-- Neural "IQ" core -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <g fill="none" stroke-width="1.8" opacity="0.95">
      <path d="M21 25 L32 31 L43 25" stroke="#0891B2"/>
      <path d="M24 41 L32 31 L40 41" stroke="#059669"/>
    </g>
    <g filter="url(#eiq-glow)">
      <circle cx="21" cy="25" r="2.7" fill="#38BDF8"/>
      <circle cx="43" cy="25" r="2.7" fill="#34D399"/>
      <circle cx="24" cy="41" r="2.7" fill="#34D399"/>
      <circle cx="40" cy="41" r="2.7" fill="#38BDF8"/>
      <circle cx="32" cy="31" r="3.6" fill="#7DD3FC"/>
    </g>
    <circle cx="32" cy="31" r="1.5" fill="#F0F9FF"/>
  </g>
</svg>
