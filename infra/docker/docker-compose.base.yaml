services:
  db:
    build:
      context: .
      dockerfile: infra/docker/postgres.Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    volumes:
      - postgres_data:/var/lib/postgresql
    ports: ["5432:5432"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-earthiq} -d ${POSTGRES_DB:-earthiq}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    env_file:
      - ../../.env
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:9000/minio/health/live || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # One-shot migration runner: Alembic is the single source of truth for the
  # schema. Runs `alembic upgrade heads` (all heads — core + module branches)
  # once the database is healthy; the backend only starts after this service
  # succeeds. When new migrations land, re-run explicitly:
  #   docker compose run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: infra/docker/backend.dev.Dockerfile
    command: alembic upgrade heads
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../../backend:/app/backend
      - ../../modules:/app/modules
      - ../../modules.lock.yaml:/app/modules.lock.yaml
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-earthiq}:${POSTGRES_PASSWORD:-earthiq}@db:5432/${POSTGRES_DB:-earthiq}

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.dev.Dockerfile
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      # The app must only start once the schema is fully migrated.
      migrate:
        condition: service_completed_successfully
    volumes:
      - ../../backend:/app/backend
      - ../../modules:/app/modules
      # module_loader.py resolves ROOT=/app and reads /app/modules.lock.yaml,
      # so the lock file must be mounted next to the code mounts.
      - ../../modules.lock.yaml:/app/modules.lock.yaml
    env_file:
      - ../../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Inside the compose network, services are reached by name, not localhost.
    # These override the localhost values in .env (real env vars win over dotenv).
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-earthiq}:${POSTGRES_PASSWORD:-earthiq}@db:5432/${POSTGRES_DB:-earthiq}
      STORAGE_ENDPOINT: http://rustfs:9000

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.dev.Dockerfile
    ports: ["3000:3000"]
    depends_on: [backend]
    volumes:
      - ../../frontend:/app/frontend
      - /app/frontend/node_modules
      - /app/frontend/apps/web/node_modules
      - ../../modules:/app/modules
    env_file:
      - ../../.env

volumes:
  postgres_data:
  rustfs_data:
