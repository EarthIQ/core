services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: earthiq
      POSTGRES_USER: earthiq
      POSTGRES_PASSWORD: earthiq
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U earthiq -d earthiq"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-earthiq}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-earthiq}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: :9000
      RUSTFS_CONSOLE_ADDRESS: :9001
      RUSTFS_CONSOLE_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      target: development
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./modules:/app/modules
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://earthiq:earthiq@db:5432/earthiq
      - JWT_SECRET=${JWT_SECRET:-change-me-in-dev}
      - CORS_ORIGINS=["http://localhost:3000"]
      - DEBUG=false
      - STORAGE_ENDPOINT=http://rustfs:9000
      - STORAGE_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-earthiq}
      - STORAGE_SECRET_KEY=${RUSTFS_SECRET_KEY:-earthiq}
      - STORAGE_BUCKET=${STORAGE_BUCKET:-earthiq}
      - STORAGE_REGION=us-east-1

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
      target: development
    ports: ["3000:3000"]
    depends_on: [backend]
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
      - /app/frontend/apps/web/node_modules
      - ./modules:/app/modules
    environment:
      - VITE_API_URL=http://localhost:8000


volumes:
  postgres_data:
  rustfs_data:
