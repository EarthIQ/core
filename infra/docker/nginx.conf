server {
    listen 80;
    server_name localhost;

    # Don't advertise the nginx version (Server header + error pages).
    server_tokens off;

    # ── Security headers (applied to every response via `always`) ─────────────
    # HSTS only takes effect once TLS is terminated in front of this server
    # (browsers ignore it over plain HTTP). Keep it so the header is present the
    # moment TLS is added upstream.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # Never allow MIME-sniffing of responses (e.g. served data files).
    add_header X-Content-Type-Options "nosniff" always;
    # This is a top-level SPA - never allow it to be embedded in a frame.
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Disable unused browser features; allow geolocation on the same origin only.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(\"self\")" always;
    # Content-Security-Policy: allow same-origin app assets plus the external
    # map tile / style providers, while disallowing inline <script>, eval, and
    # object embedding. The http(s) img/connect/font sources are required for
    # the basemap tile + style servers; tighten to https: in a locked-down prod.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; font-src 'self' data: http: https:; connect-src 'self' http: https: data: blob:; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
