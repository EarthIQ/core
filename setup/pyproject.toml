[project]
name = "setup-cli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "questionary>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "tomlkit>=0.12",
]

[project.scripts]
setup = "setup_cli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"